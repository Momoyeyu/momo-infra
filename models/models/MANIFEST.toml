# MANIFEST.toml —— 模型下载清单（口径见 src/momo_models/manifest.py 与
# docs/02-repos/momo-models.md「provider 与产物」）。
#
# 权重实体在 $MOMO_MODELS_DIR（默认 ~/.cache/momo/models，不入库），
# dest 镜像 <owner>/<repo> 布局。下载与校验由 momo-infra `momoctl pull` 执行；
# 运行时 provider 只读本地路径，sha256 校验不过 → readyz 拒绝就绪。
#
# license：结构化许可（spdx/source；非 SPDX 许可另带 name），逐条按上游仓库核对。
#
# source：条目下载源，`hf`（缺省）经 HF_ENDPOINT 拼 `<endpoint>/<repo_id>/resolve/
# <revision>/<path>`；`url` 为逐文件直链（files[].url 必填，如 GitHub raw），
# 不经 HF_ENDPOINT。hf 条目下 files[].url 可作单文件覆盖。
#
# sha256 口径：LFS 文件取 HF tree API 的 `lfs.oid`（即内容 sha256）；
# 非 LFS 小文件按 hf-mirror resolve 实下载后本地 sha256sum 得出。

